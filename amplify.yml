version: 1
applications:
  - appRoot: pixelence-mri-system
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - npm ci
        build:
          commands:
            - npm run build
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
