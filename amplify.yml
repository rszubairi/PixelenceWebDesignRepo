version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm ci --prefix pixelence-mri-system
    build:
      commands:
        - npx turbo@2.8.9 run build --filter=pixelence-mri-system
  artifacts:
    baseDirectory: pixelence-mri-system/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - pixelence-mri-system/node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'max-age=0, no-cache, no-store, must-revalidate'