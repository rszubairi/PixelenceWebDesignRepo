version: 1
applications:
  - appRoot: pixelence-mri-system
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
      build:
        exclude:
          - 'pixelence-mobile/**'
          - 'backend-ml/**'
          - 'convex/**'
