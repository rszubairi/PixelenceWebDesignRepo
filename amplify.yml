version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd pixelence-mri-system
        - npm ci
    build:
      commands:
        - cd pixelence-mri-system
        - npm run build
  artifacts:
    baseDirectory: pixelence-mri-system
    files:
      - '**/*'
  cache:
    paths:
      - pixelence-mri-system/node_modules/**/*
      - pixelence-mri-system/.next/cache/**/*

