version: 1
applications:
  - appRoot: pixelence-mri-system
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    env:
      variables:
        # Set your actual Convex URL in Amplify Console environment variables
        # The build will fail without a valid NEXT_PUBLIC_CONVEX_URL
        NEXT_PUBLIC_CONVEX_URL: $NEXT_PUBLIC_CONVEX_URL