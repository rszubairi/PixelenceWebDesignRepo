version: 1
applications:
  - appRoot: pixelence-mri-system
    framework: Next.js - SSR
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - env | grep -e _BUILD_ -e _BRANCH
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
