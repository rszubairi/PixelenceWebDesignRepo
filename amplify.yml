version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix pixelence-mri-system ci
    build:
      commands:
        - npm --prefix pixelence-mri-system run build
  artifacts:
    baseDirectory: pixelence-mri-system/out
    files:
      - '**/*'
  cache:
    paths:
      - pixelence-mri-system/node_modules/**/*
      - pixelence-mri-system/.next/cache/**/*
