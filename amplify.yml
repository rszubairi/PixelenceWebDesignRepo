version: 1
applications:
  - appRoot: pixelence-mri-system
    framework:
      name: Next.js - SSR
      version: '14'
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 18
            - nvm use 18
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
