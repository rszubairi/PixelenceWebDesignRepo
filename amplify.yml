version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix pixelence-mri-system
    build:
      commands:
        - npm run build --prefix pixelence-mri-system
  artifacts:
    baseDirectory: pixelence-mri-system
    files:
      - '.next/**/*'
      - 'public/**/*'
      - 'package.json'
      - 'next.config.js'
  cache:
    paths:
      - pixelence-mri-system/node_modules/**/*
      - pixelence-mri-system/.next/cache/**/*
