version: 1
applications:
  - appRoot: pixelence-mri-system
    framework: Next.js - SSR
    frontend:
      phases:
        preBuild:
          commands:
            - cd pixelence-mri-system
            - npm ci
        build:
          commands:
            - env | grep -e _BUILD_ -e _BRANCH
            - npm run build --prefix pixelence-mri-system
      artifacts:
        baseDirectory: pixelence-mri-system/.next
        files:
          - '**/*'
      cache:
        paths:
          - pixelence-mri-system/node_modules/**/*
          - pixelence-mri-system/.next/cache/**/*
