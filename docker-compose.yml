version: '3.8'

services:
  # ML Service (FastAPI)
  ml-service:
    build:
      context: ./backend-ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_PATH=/app/models
      - MAX_CONCURRENT_JOBS=3
      - JOB_TIMEOUT_SECONDS=3600
      - LOG_LEVEL=INFO
    volumes:
      - ./backend-ml/models:/app/models
      - ./backend-ml/uploads:/app/uploads
      - ./backend-ml/results:/app/results
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Gateway Service (Node.js)
  gateway:
    build:
      context: ./pixelence-mri-system/backend-gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
      - PORT=3001
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=104857600
    volumes:
      - ./pixelence-mri-system/backend-gateway/uploads:/app/uploads
    depends_on:
      - redis
      - ml-service
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and job management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Application (Next.js)
  frontend:
    build:
      context: ./pixelence-mri-system
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_CONVEX_URL=https://your-convex-app.convex.cloud
    volumes:
      - ./pixelence-mri-system:/app
      - /app/node_modules
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
